# RichTalk Redis configuration

# Bind to all interfaces inside container
bind 0.0.0.0

# Require password (set via REDIS_PASSWORD env in compose, but redis.conf
# uses a literal — override with requirepass in compose command args if needed)
# For Docker, the password is passed via command: redis-server --requirepass ${REDIS_PASSWORD}
# This file sets safe defaults; password enforcement is handled in docker-compose.yml

protected-mode yes

# Persistence: RDB snapshot
save 900 1
save 300 10
save 60 10000

# Max memory policy for cache use-case
maxmemory-policy allkeys-lru

# Logging
loglevel notice
logfile ""

# Append-only file for durability
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
